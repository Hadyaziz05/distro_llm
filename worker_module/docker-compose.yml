services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: >
      redis-server
      --maxmemory 512mb
      --maxmemory-policy noeviction
      --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  context-builder:
    build: .
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379
      - REDIS_STREAM_KEY=inference_queue
      - CACHE_COLLECTION=semantic_cache
      - CACHE_SIMILARITY_THRESHOLD=0.92
      - REDIS_READER_MAX_CONNECTIONS=10
      - RESULT_TIMEOUT_SEC=60
    env_file:
      - .env
    volumes:
      - ./.env:/app/.env:ro
    depends_on:
      redis:
        condition: service_healthy

volumes:
  redis_data: